name: test

on:
  push:
    branches: [master]
  pull_request:

# Read-only token: the workflow only checks out code and runs tests
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # Supported Node lines. mocha 12 needs ^20.19 or >=22.12; Node 20 is end-of-life.
        node: [22, 24, 26]
    steps:
      # Actions pinned to commit SHAs so a moved tag can't change what runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
